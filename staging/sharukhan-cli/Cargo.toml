[package]
name = "sharukhan"
version = "0.1.0"
edition = "2021"
description = "Permutation-matrix harness for Photon OS ISO/PR verification"
license = "Apache-2.0"

[[bin]]
name = "sharukhan"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
strip = true
